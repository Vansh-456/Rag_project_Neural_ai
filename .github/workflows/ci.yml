name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install (CPU-only, no ML extras needed for the offline test suite)
        run: |
          uv venv && . .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Lint
        run: . .venv/bin/activate && ruff check src tests scripts && ruff format --check src tests scripts
      - name: Type check
        run: . .venv/bin/activate && mypy
      - name: Tests
        run: . .venv/bin/activate && pytest --cov=agvrag --cov-report=term-missing -m "not slow"

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/api.Dockerfile -t agvrag-api .
      - run: docker build -f docker/frontend.Dockerfile -t agvrag-frontend .
