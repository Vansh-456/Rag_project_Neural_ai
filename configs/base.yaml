# Base configuration. Every experiment `extends` this file and overrides only what it varies.
# Resolved configs are written to results/<exp_id>/config.yaml for reproducibility.
seed: 42
env: development

ingestion:
  parser: pymupdf
  arxiv_delay_seconds: 3.0

chunking:
  strategy: structure_aware
  chunk_size: 256
  overlap: 32

embedding:
  provider: sentence_transformers
  model: BAAI/bge-small-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
  document_prefix: ""
  batch_size: 32

vector_store:
  backend: qdrant_local   # qdrant_local (embedded, no server) | qdrant (server) | memory

bm25:
  implementation: scratch
  k1: 1.5
  b: 0.75

graph:
  backend: networkx
  extractor: rule

retrieval:
  top_k: 10
  candidate_pool: 50
  fusion: rrf
  rrf_k: 60
  graph:
    max_hops: 2
    hop_decay: 0.6
    max_paths: 20

reranker:
  enabled: true
  provider: cross_encoder
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  candidate_pool: 50

router:
  mode: fixed

context:
  max_tokens: 2500
  ordering: relevance

generation:
  provider: extractive    # extractive (no LLM) | anthropic | openai | ollama
  model: ""               # empty -> provider default (anthropic: claude-opus-5-5)
  effort: medium
  max_tokens: 700

verification:
  method: lexical

evaluation:
  split: dev
  k_values: [1, 3, 5, 10]
  primary_k: 5
  bootstrap_samples: 1000

logging:
  level: INFO
  json_logs: false
