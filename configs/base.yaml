# Base System Configuration
app:
  name: "Adaptive Graph + Vector RAG"
  environment: "development"
  log_level: "INFO"
  host: "0.0.0.0"
  port: 8000

corpus:
  raw_dir: "data/raw/papers"
  processed_dir: "data/processed"
  documents_file: "data/processed/documents/corpus_documents.json"
  chunks_file: "data/processed/chunks/corpus_chunks.json"
  graph_file: "data/processed/entities/corpus_graph.json"

chunking:
  strategy: "structure_aware"  # fixed | recursive | semantic | structure_aware
  chunk_size: 512              # target tokens
  chunk_overlap: 64            # overlap tokens
  respect_sections: true
  attach_heading_context: true

embeddings:
  provider: "sentence-transformers"  # sentence-transformers | mock
  model_name: "BAAI/bge-small-en-v1.5"
  dimension: 384
  batch_size: 32
  normalize: true
  cache_dir: "data/cache/embeddings"

vector_store:
  backend: "in_memory"         # in_memory | qdrant
  collection_name: "rag_corpus"
  host: "localhost"
  port: 6333
  distance_metric: "cosine"

sparse_retrieval:
  backend: "rank_bm25"
  k1: 1.5
  b: 0.75
  lowercase: true
  remove_stopwords: true

graph:
  backend: "networkx"          # networkx | neo4j
  neo4j_uri: "bolt://localhost:7687"
  neo4j_user: "neo4j"
  neo4j_password: "adaptive_rag_password"
  max_traversal_depth: 3
  decay_factor: 0.85
  min_edge_confidence: 0.7

retrieval:
  default_strategy: "adaptive" # vector | bm25 | hybrid | graph | multi_hop | adaptive
  dense_top_k: 10
  sparse_top_k: 10
  graph_top_k: 10
  final_top_k: 5
  fusion_method: "rrf"         # rrf | weighted
  rrf_k: 60
  dense_weight: 0.6
  sparse_weight: 0.4
  graph_weight: 0.5

reranking:
  enabled: true
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  candidate_pool_size: 20
  batch_size: 16

routing:
  strategy: "rule_based"       # rule_based | llm | learned
  confidence_threshold: 0.75

generation:
  provider: "mock"             # mock | openai | anthropic | ollama
  model_name: "gpt-4o-mini"
  temperature: 0.0
  max_tokens: 1024
  enforce_citations: true
  abstain_when_uncertain: true

verification:
  enabled: true
  max_retries: 2
  contradiction_threshold: 0.8
  min_supported_claims_ratio: 0.8

budget:
  max_retrieval_calls: 5
  max_graph_hops: 3
  max_candidate_pool: 50
  max_latency_ms: 5000
  max_token_budget: 4096
  cost_per_1k_prompt_tokens: 0.00015
  cost_per_1k_completion_tokens: 0.0006
