# Seed alias table for entity recognition, normalization and resolution (Phase 8).
# - `aliases` are surface forms that must resolve to the same canonical entity.
# - `introduced_in` (optional) is a *prior* that the given corpus paper introduces the entity.
#   The rule extractor only emits an INTRODUCES edge if it can ground it in that paper's text
#   (the alias must appear in the paper's abstract/introduction chunks), so every edge still
#   traces back to source text.
# - `case_sensitive: true` for short acronyms that collide with English words.
