# One-command bring-up:  docker compose up -d --build
# First run builds the corpus/index inside the api container (AUTO_BOOTSTRAP=true), or run
#   docker compose run --rm api agvrag bootstrap
name: agvrag

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      retries: 10

  neo4j:
    image: neo4j:5.24-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 1G
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      retries: 20

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file:
      - path: .env
        required: false
    environment:
      AGVRAG_ENV: production
      AUTO_BOOTSTRAP: ${AUTO_BOOTSTRAP:-true}
    ports: ["8000:8000"]
    volumes:
      - agv_data:/app/data
      - agv_results:/app/results
    depends_on:
      qdrant: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    environment:
      API_URL: http://api:8000
      API_USERNAME: ${API_USERNAME:-admin}
      # Required: production config enables API auth, and the API refuses to start without it
      # (only after the first-start bootstrap, so fail here instead).
      API_PASSWORD: ${API_PASSWORD:?set API_PASSWORD in .env}
      UI_BASIC_AUTH_USER: ${UI_BASIC_AUTH_USER:-}
      UI_BASIC_AUTH_PASSWORD: ${UI_BASIC_AUTH_PASSWORD:-}
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  qdrant_data:
  neo4j_data:
  agv_data:
  agv_results:
