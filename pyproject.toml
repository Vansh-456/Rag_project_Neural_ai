[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agvrag"
version = "1.0.0"
description = "Adaptive Graph + Vector RAG: a measured, inspectable retrieval system that routes between semantic and relational retrieval."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Adaptive Graph Vector RAG contributors" }]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "networkx>=3.2",
    "rank-bm25>=0.2.2",
    "snowballstemmer>=2.2",
    "tiktoken>=0.7",
    "qdrant-client>=1.10",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Heavy ML stack: real embedders, cross-encoder rerankers, NLI verifier.
ml = ["sentence-transformers>=3.0"]
# Optional external services / providers.
neo4j = ["neo4j>=5.20"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
plots = ["matplotlib>=3.8"]
all = ["agvrag[ml,neo4j,anthropic,openai,plots]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
agvrag = "agvrag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agvrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs downloaded models or network (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["agvrag"]
omit = ["src/agvrag/api/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]  # formatter owns line length

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["agvrag"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
